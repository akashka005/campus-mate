services:
  - type: web
    name: campus-mate-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: GROQ_API_KEY
        sync: false 
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./campusmate.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: CHROMA_DB_DIR
        value: ./db/chroma

  - type: web
    name: campus-mate-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: campus-mate-backend
          property: host