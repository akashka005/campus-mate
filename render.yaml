services:
  # Backend Service
  - type: web
    name: campus-mate-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: GROQ_API_KEY
        sync: false # Set in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./campusmate.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: CHROMA_DB_DIR
        value: ./db/chroma
    disk:
      name: campus-mate-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

  # Frontend Service (Static Site)
  - type: web
    name: campus-mate-frontend
    env: static
    buildCommand: npm install && npm run build
    publishPath: frontend/dist
    rootDir: .
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: campus-mate-backend
          property: host
