services:
  - type: web
    name: campus-mate-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: GROQ_API_KEY
        sync: false 
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./campusmate.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: CHROMA_DB_DIR
        value: ./db/chroma
    disk:
      name: campus-mate-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

  - type: static
    name: campus-mate-frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: campus-mate-backend
          property: host